name: Update LeetCode Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Update README
        run: |
          USERNAME="Ghost_taker"
          
          # Create README with stats card
          cat > README.md << EOF
          # LeetCode Stats
          
          ## 📊 My Progress
          
          ![LeetCode Stats](https://leetcard.jacoblin.cool/${USERNAME}?theme=dark&font=Inter&ext=heatmap)
          
          ## 🔥 Daily Streak
          
          ![LeetCode Streak](https://leetcode-badge-showcase.vercel.app/api?username=${USERNAME}&animated=true)
          
          ## 📈 Solved Problems
          
          ![LeetCode Stats](https://leetcode-stats-api.herokuapp.com/${USERNAME})
          
          ---
          *Auto-updated daily*
          EOF
          
          echo "✅ README updated!"
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Update LeetCode stats"
          git push || echo "No changes to push"
