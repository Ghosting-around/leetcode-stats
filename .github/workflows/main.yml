name: Update LeetCode Stats

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight
  workflow_dispatch:  # Allows manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Update stats
        run: |
          python -c "
          import requests, json, os
          
          # Change 'your_username' to your actual LeetCode username
          USERNAME = 'Ghost_taker'
          url = f'https://leetcode-api-faisalshohag.vercel.app/{USERNAME}'
          
          try:
              response = requests.get(url)
              data = response.json()
              
              total = data.get('totalSolved', 0)
              easy = data.get('easySolved', 0)
              medium = data.get('mediumSolved', 0)
              hard = data.get('hardSolved', 0)
              streak = data.get('streak', 0)
              
              # Create README with stats
              readme = f'''# 📊 LeetCode Stats

## 🏆 Overall Progress
- **Total Solved:** {total}
- 🟢 Easy: {easy}
- 🟡 Medium: {medium}
- 🔴 Hard: {hard}

## 🔥 Current Streak
- **{streak} days** 🔥

## 📈 Progress Chart
![LeetCode Stats](https://leetcard.jacoblin.cool/{USERNAME}?theme=dark&font=Inter)

---
*Last updated: {response.headers.get('date', 'Unknown')}*
'''
              
              with open('README.md', 'w') as f:
                  f.write(readme)
                  
              print('✅ Stats updated successfully!')
              
          except Exception as e:
              print(f'❌ Error: {e}')
              # Don't fail the workflow if API fails
              exit(0)
          "
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "📊 Update LeetCode stats [skip ci]"
          git push || echo "No changes to push"
